# This workflow simulates a production deployment and sends an email notification to the on-call engineer if the deployment fails (via `exit 1`). 
# It uses the same Mailgun action for consistency with other workflows.

name: Deploy to Production

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true      

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Deploy
        id: deploy
        run: |
          echo "Deploying to production..."
          exit 1  # Simulates a deployment failure

      - name: Notify on-call engineer on failure
        if: failure()
        uses: vineetchoudhary/mailgun-action@master
        with:
          api-key: ${{ secrets.MAILGUN_API_KEY }}
          domain: ${{ secrets.MAILGUN_DOMAIN }}
          from: ${{ vars.SENDER_EMAIL }}
          to: ${{ vars.ONCALL_EMAIL }}
          subject: "Production deployment failed"
          body: |
            <h3>Deployment Failed</h3>
            <p><strong>Repo:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>