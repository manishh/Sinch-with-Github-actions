# This workflow sends an email notification to the PM when a PR is merged into master. 
#It uses the same Mailgun action for consistency with other workflows.

name: PR Merge Notification

on:
  pull_request:
    types: [closed]
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true      

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify PM on PR merge
        uses: vineetchoudhary/mailgun-action@master
        with:
          api-key: ${{ secrets.MAILGUN_API_KEY }}
          domain: ${{ secrets.MAILGUN_DOMAIN }}
          from: ${{ vars.SENDER_EMAIL }}
          to: ${{ vars.PM_EMAIL }}
          subject: "PR merged: ${{ github.event.pull_request.title }}"
          body: |
            <h3>Pull Request Merged</h3>
            <p><strong>PR:</strong> ${{ github.event.pull_request.title }}</p>
            <p><strong>Author:</strong> ${{ github.event.pull_request.user.login }}</p>
            <p><strong>Merged by:</strong> ${{ github.actor }}</p>
            <p><a href="${{ github.event.pull_request.html_url }}">View PR</a></p>